server:
  port: 8083

spring:
  application:
    name: jpa-hibernate-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jpa_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    # 遗留 hbm.xml 映射注册（插件 HbmXmlEntityResolver 场景）
    mapping-resources: hbm/LegacyItem.hbm.xml
    # 仅演示环境使用 update；生产请使用 validate / none
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # HibernateTemplate/HibernateDaoSupport 老式 DAO 复用 JPA 事务的当前 Session：
        # JpaTransactionManager 事务激活时 SpringSessionContext 从 EntityManagerHolder 解出同一 Session，
        # 使 template 的 UPDATE/DELETE 与 CRUD 参与 JPA 事务（否则 template 每次开新会话抛 TransactionRequiredException）
        current_session_context_class: org.springframework.orm.hibernate5.SpringSessionContext
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
