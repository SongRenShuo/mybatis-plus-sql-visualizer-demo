server:
  port: 8085

spring:
  application:
    name: multi-orm-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/orm_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Easy-Query 数据库方言（EasyQueryProperties）
easy-query:
  database: mysql
  keep-global-style: true

# MyBatis 控制台日志（xbatis 底层走 MyBatis，喂插件 MyBatisLogParser）
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    org.springframework.jdbc.core: debug

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
