server:
  port: 8081

spring:
  application:
    name: mybatis-plus-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mp_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  # XML 映射文件位置
  mapper-locations: classpath*:mapper/*.xml
  # 实体类别名包
  type-aliases-package: cn.song.mybatisplusdemo.entity
  configuration:
    # 驼峰转下划线
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（便于插件/日志查看实际执行的 SQL）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    cn.song.mybatisplusdemo.mapper: debug
