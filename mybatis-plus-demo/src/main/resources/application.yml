server:
  port: 8081

spring:
  # 环境切换：IDEA Maven 面板勾选 profile（mysql 默认 / pg / gaussdb）→ 构建期替换成对应 Spring profile，
  # 再去加载 application-{profile}.yml。写法与 mybatis-plus-join-demo 的 dm/mysql 同款
  # （spring-boot-starter-parent 已对 application*.yml 做 @..@ 资源过滤）。
  # 占位符必须带引号：IDEA 自己的 Build 不过滤资源，会把 @profiles.active@ 原样拷进 target/classes，
  # 裸 @ 是 YAML 非法起始字符 → 应用起不来；带引号则退化成无害的未知 profile 名，照常启动。
  profiles:
    active: "@profiles.active@"
  application:
    name: mybatis-plus-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mp_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  # XML 映射文件位置
  mapper-locations: classpath*:mapper/*.xml
  # 实体类别名包
  type-aliases-package: cn.song.mybatisplusdemo.entity
  configuration:
    # 驼峰转下划线
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（便于插件/日志查看实际执行的 SQL）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    cn.song.mybatisplusdemo.mapper: debug
