server:
  port: 8089

spring:
  application:
    name: shadow-entity-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jpa_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    # 演示环境：启动按实体自动建表/补列（生产请用 validate / none）。
    # 注意：建出来的是**宿主影子版**的表 wms_task_project；JAR 版的 wms_task_jar 不会被创建
    #（同 FQN 的类以工程输出为准，JAR 里那份运行期不生效）。
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
